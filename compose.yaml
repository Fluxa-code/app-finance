services:
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "psql -U myuser -d mydatabase -c 'SELECT 1'"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
