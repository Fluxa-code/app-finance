# ============================================================
# PRODUCAO — NENHUM valor sensivel escrito aqui.
# Tudo vem de variavel de ambiente, definida no painel da
# plataforma (Render). Este arquivo vai pro Git; segredo NAO.
#
# Se uma variavel obrigatoria faltar, a aplicacao NAO SOBE.
# E proposital: melhor falhar no deploy que rodar inseguro.
# ============================================================

# nunca tentar subir Docker em producao
spring.docker.compose.enabled=false

# A plataforma (Render) escolhe a porta e informa pela variavel PORT.
# Se a app nao escutar nela, o deploy falha com "no open ports detected".
server.port=${PORT:8080}

# banco (Supabase) — session pooler, IPv4 e com prepared statements
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

# pool enxuto: plano free tem poucas conexoes disponiveis
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# dominio real do front (Vercel)
app.cors.origins=${CORS_ORIGINS}

# segredo que assina os tokens — SEM default de proposito
app.jwt.secret=${JWT_SECRET}

spring.jpa.show-sql=false
