# ============================================================
# CONFIG COMUM — vale em todos os ambientes.
# O que muda entre dev e prod fica em application-{perfil}.properties
#
# Perfil ativo: dev por padrao (sua maquina). Em producao, a
# plataforma define SPRING_PROFILES_ACTIVE=prod.
# ============================================================
spring.application.name=finance
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# schema e responsabilidade do Flyway — Hibernate so confere
spring.jpa.hibernate.ddl-auto=validate

# nunca vazar stack trace nas respostas de erro
server.error.include-stacktrace=never
server.error.include-message=always
