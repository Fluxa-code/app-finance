<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kofre — suas finanças, em qualquer lugar</title>
    <meta name="description" content="Kofre — controle suas finanças em todos os seus dispositivos, em tempo real. Um produto Fluxa Labs." />

    <!-- ícones -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- PWA: o manifest é o que permite "instalar" o app -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- cor da barra do navegador no celular, acompanhando o tema -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf9f6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0f13" />

    <!-- iOS: abre em tela cheia quando adicionado à tela inicial -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kofre" />

    <!-- link compartilhado no WhatsApp/LinkedIn mostra card decente -->
    <meta property="og:title" content="Kofre — suas finanças, em qualquer lugar" />
    <meta property="og:description" content="Controle suas finanças em todos os seus dispositivos, em tempo real." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icone-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
